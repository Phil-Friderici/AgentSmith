services:
  maintainer-broker:
    image: agentforge-maintainer-broker:phase7a
    build:
      context: ../containers
      dockerfile: Dockerfile
      target: maintainer-broker
    profiles:
      - phase7a-broker
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    tmpfs:
      - /run/agentforge-broker-audit:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    command: ["--self-check"]
